[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailbot-cli"
version = "0.1.0"
description = "Unofficial CLI for trailbot.com mountain bike trail conditions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trailbot = "trailbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/bobbymarko/trailbot-cli"
Issues = "https://github.com/bobbymarko/trailbot-cli/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live API tests (set TRAILBOT_INTEGRATION=1)"]

[tool.hatch.build.targets.wheel]
packages = ["src/trailbot"]
