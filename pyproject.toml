[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailbot-cli"
version = "0.1.0"
description = "Unofficial CLI for trailbot.com mountain bike trail conditions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trailbot = "trailbot.cli:main"

[project.urls]
Homepage = "https://github.com/bobertoni/trailbot-cli"
Issues = "https://github.com/bobertoni/trailbot-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trailbot"]
